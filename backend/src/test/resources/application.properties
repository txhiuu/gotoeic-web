# Cau hinh rieng cho test: dung H2 in-memory (che do tuong thich PostgreSQL)
# -> chay `./mvnw test` o bat ky may nao, khong can cai PostgreSQL.
spring.datasource.url=jdbc:h2:mem:toeic_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
